name: Build Windows (Vulkan)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    env:
      OLLAMA_VERSION: 0.32.6
      VULKAN_SDK_VER: 1.4.309.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Ollama version
        shell: bash
        run: |
          git remote add upstream https://github.com/ollama/ollama.git 2>/dev/null || true
          git fetch --tags upstream 2>/dev/null || true
          VER=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -z "$VER" ]; then
            VER="${{ env.OLLAMA_VERSION }}"
          fi
          echo "OLLAMA_VERSION=${VER#v}" >> "$GITHUB_ENV"

      - name: Install Vulkan SDK
        shell: powershell
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VER/windows/VulkanSDK-$env:VULKAN_SDK_VER-Installer.exe"
          Invoke-WebRequest -Uri $url -OutFile vulkansdk.exe
          .\vulkansdk.exe /S
          "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_SDK_VER" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Configure
        run: >
          cmake -S . -B build
          -DOLLAMA_LLAMA_BACKENDS=vulkan
          -DOLLAMA_VERSION=$env:OLLAMA_VERSION
          -DCMAKE_BUILD_TYPE=Release
          -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Assemble package
        shell: powershell
        run: |
          $out = "release\Ollama-Vulkan"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item ollama.exe $out\
          Copy-Item build\lib\ollama "$out\lib\ollama" -Recurse -Force
          Set-Content -Path "$out\start-ollama.bat" -Value "@echo off`r`ncd /d `"%~dp0`"`r`nollama serve`r`n" -Encoding ascii
          Compress-Archive -Path $out -DestinationPath release\Ollama-Vulkan.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Ollama-Vulkan
          path: release/Ollama-Vulkan.zip

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/Ollama-Vulkan.zip
